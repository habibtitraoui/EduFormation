name: Verify landing page

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://www.example.com
      VITE_CONTACT_EMAIL: ""
      VITE_CONTACT_ENDPOINT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - name: Preview and audit the production build
        run: |
          npm run preview > /tmp/landing-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ -o /dev/null
          npm run test:browser
          npm run test:performance
          npm run audit:lighthouse
      - name: Build and test the configured demo form
        env:
          VITE_CONTACT_EMAIL: contact@training.example
          VITE_CONTACT_ENDPOINT: /test-demo
        run: |
          npm run build -- --outDir .cache/form-dist
          npm run preview -- --outDir .cache/form-dist --port 4174 > /tmp/form-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/ -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4174/ -o /dev/null
          npm run test:form
      - name: Build and test the mailto fallback
        env:
          VITE_CONTACT_EMAIL: contact@training.example
          VITE_CONTACT_ENDPOINT: ""
        run: |
          npm run build -- --outDir .cache/mail-dist
          npm run preview -- --outDir .cache/mail-dist --port 4175 > /tmp/mail-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/ -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4175/ -o /dev/null
          npm run test:mailto
