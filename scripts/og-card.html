<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: Inter;
      src: url("../src/fonts/InterVariable.woff2") format("woff2-variations");
      font-weight: 100 900;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: #f7f8fa;
      color: #0d1117;
      font-family: Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card { width: 100%; height: 100%; padding: 64px 72px 62px; display: flex; flex-direction: column; }
    .top { display: flex; align-items: center; justify-content: space-between; }
    .wordmark { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
    .mark { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 6px; background: #11161d; color: white; font-size: 19px; letter-spacing: -.04em; }
    .category { font-size: 16px; color: #5b6572; font-weight: 500; }
    .headline { margin: auto 0; font-size: 64px; line-height: 1.12; font-weight: 600; letter-spacing: -.035em; }
    .headline span { display: block; color: #5b6572; }
    .rule { height: 1px; background: #cdd3db; }
    .capabilities { margin: 24px 0 0; color: #5b6572; font-size: 19px; line-height: 1.4; }
    .capabilities span { margin: 0 14px; color: #8a93a0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="wordmark"><span class="mark">EF</span><span>EduFormation</span></div>
      <span class="category">Corporate training video platform</span>
    </div>
    <div class="headline">Company training,<span>organised and trackable.</span></div>
    <div class="rule"></div>
    <p class="capabilities">Learning paths <span>·</span> Live sessions <span>·</span> Course certificates</p>
  </div>
</body>
</html>
