<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: Inter;
      src: url("../src/fonts/InterVariable.woff2") format("woff2-variations");
      font-weight: 100 900;
    }
    @font-face {
      font-family: Poppins;
      src: url("../src/fonts/PoppinsLatin-SemiBold.woff2") format("woff2");
      font-weight: 600;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      background: #f7f8fa;
      color: #0d1117;
      font-family: Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card { height: 100%; padding: 54px 72px; display: flex; flex-direction: column; }
    .top { display: flex; align-items: center; justify-content: space-between; }
    .wordmark { display: flex; align-items: center; gap: 12px; font: 600 26px Poppins, Inter, sans-serif; letter-spacing: -.04em; }
    .mark { width: 46px; height: 46px; }
    .category { padding: 9px 16px; border: 1px solid #bfd4fa; border-radius: 99px; background: #eff6ff; color: #2563eb; font-size: 16px; }
    .headline { margin: auto 0; font: 600 67px/1.15 Poppins, Inter, sans-serif; letter-spacing: -.045em; }
    .headline span { display: block; color: #2563eb; }
    .underline { display: block; width: 390px; height: 18px; margin-top: 6px; color: #2563eb; }
    .capabilities { margin: 0; padding-top: 24px; border-top: 1px solid #e3e6eb; color: #5b6572; font-size: 20px; }
    .capabilities span { margin: 0 14px; color: #2563eb; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="wordmark"><img class="mark" src="../public/favicon.svg" alt="" />EduFormation</div>
      <span class="category">Learning and development · H2D.dev</span>
    </div>
    <h1 class="headline">
      Your own training platform,<span>built for your organization.</span>
      <svg class="underline" viewBox="0 0 440 18" preserveAspectRatio="none" fill="none" aria-hidden="true">
        <path d="M3 11C100 22 220 -1 437 8" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" />
      </svg>
    </h1>
    <p class="capabilities">Learning paths <span>·</span> Live sessions <span>·</span> Course certificates</p>
  </div>
</body>
</html>
