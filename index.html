    <meta property="og:site_name" content="EduFormation" />

    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          { "@type": "Organization", "name": "EduFormation", "url": "%VITE_SITE_URL%/", "logo": "%VITE_SITE_URL%/favicon.svg" },
          { "@type": "SoftwareApplication", "name": "EduFormation", "url": "%VITE_SITE_URL%/", "applicationCategory": "BusinessApplication", "operatingSystem": "Web", "description": "Corporate training video platform: learning paths, courses, per-learner progress, live sessions, and certificates issued by the course itself." }
        ]
      }
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("eduformation-landing-theme");
          var system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var resolved = stored === "light" || stored === "dark" ? stored : system;
          if (resolved === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        var stored = null;
        try { stored = localStorage.getItem("eduformation-landing-locale"); } catch (e) {}
        var candidates = stored === "en" || stored === "fr" || stored === "ar"
          ? [stored]
          : (navigator.languages || [navigator.language]);
        for (var i = 0; i < candidates.length; i++) {
          var language = candidates[i].toLowerCase().split("-")[0];
          if (language === "en" || language === "fr" || language === "ar") {
            root.lang = language;
            root.dir = language === "ar" ? "rtl" : "ltr";
            break;
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main class="site-fallback">
        <h1>EduFormation — Corporate training, organised and trackable.</h1>
        <p>EduFormation is a corporate training video platform with learning paths, courses, per-learner progress, live sessions, and certificates issued when a course is completed.</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
