    <script>
      (function () {
        try {
          var stored = localStorage.getItem("eduformation-landing-theme");
          var system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var resolved = stored === "light" || stored === "dark" ? stored : stored === "system" ? system : "dark";
          if (resolved === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        var stored = null;
        try { stored = localStorage.getItem("eduformation-landing-locale"); } catch (e) {}
        var language = stored === "en" || stored === "fr" || stored === "ar" ? stored : "ar";
        root.lang = language;
        root.dir = language === "ar" ? "rtl" : "ltr";
      })();
    </script>
